name: Capturas

# Capturas de las pantallas con datos de ejemplo (móvil, tablet y tele) para revisar el diseño.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK
        run: |
          SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
      - name: Datos de los logos
        run: python3 .github/scripts/logo_data.py
      - name: Capturas
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew testDebugUnitTest --tests 'com.suso.miiptv.ScreensTest' --no-daemon 2>&1 | tee test.log || {
            grep -E "e: |Exception|Error|at com.suso" test.log | head -30 | while IFS= read -r l; do echo "::error::$l"; done
            ls app/build/test-results/testDebugUnitTest/ 2>/dev/null
          }
          ls -la app/build/screens || true
      - name: Detalle de fallos
        if: always()
        run: |
          for f in app/build/test-results/testDebugUnitTest/*.xml; do grep -A15 "<failure" "$f" | head -40 | while IFS= read -r l; do echo "::warning::$l"; done; done || true
      - name: Publicar capturas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view capturas >/dev/null 2>&1 || gh release create capturas --prerelease --title "Capturas de diseño" --notes "Capturas automáticas"
          gh release upload capturas app/build/screens/*.png --clobber
