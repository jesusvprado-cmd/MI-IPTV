name: Versiones (temporal)
# Paso temporal: lista las últimas versiones de las herramientas de Google para actualizar las librerías.
on:
  push:
    paths: [ '.github/workflows/versiones.yml' ]
jobs:
  versiones:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          G=https://dl.google.com/dl/android/maven2
          echo "== AGP 8: $(curl -sS $G/com/android/tools/build/gradle/maven-metadata.xml | grep -o '<version>8[^<]*</version>' | sed 's/<[^>]*>//g' | grep -viE 'alpha|beta|rc|dev' | tail -4 | tr '\n' ' ')"
          meta(){ curl -sS -o x.aar "$G/$1/$2/$3/$2-$3.aar" && echo "== $2 $3: $(unzip -p x.aar META-INF/com/android/build/gradle/aar-metadata.properties | grep -E 'minCompileSdk=|minAndroidGradle' | tr '\n' ' ')"; }
          for v in 1.16.0 1.17.0 1.18.0; do meta androidx/core core-ktx $v; done
          for v in 1.11.0 1.12.4 1.13.0; do meta androidx/activity activity-compose $v; done
          for v in 2.9.4 2.10.0; do meta androidx/lifecycle lifecycle-runtime-android $v; done
          for v in 1.9.4 1.10.1; do meta androidx/media3 media3-exoplayer $v; done
          for B in 2025.09.00 2025.12.00 2026.01.00 2026.02.00 2026.03.00 2026.04.00 2026.05.01 2026.06.01; do
            U=$(curl -sS $G/androidx/compose/compose-bom/$B/compose-bom-$B.pom | grep -A1 '<artifactId>ui</artifactId>' | grep -o '[0-9][^<]*' | head -1)
            [ -n "$U" ] && meta androidx/compose/ui ui-android $U && echo "   (BOM $B)"
          done
