name: Compilar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

# Una compilación cada vez y en orden: así una antigua que termine tarde no queda como «última versión».
# (Sin cancelar la que está en marcha, para no dejar a medias una versión publicada.)
concurrency:
  group: compilar-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        run: |
          SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "Usando $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v5

      - name: Datos de los logos (van dentro de la app)
        run: python3 .github/scripts/logo_data.py

      - name: Prueba de logos
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew testDebugUnitTest --tests 'com.suso.miiptv.LogoGoldenTest' --tests 'com.suso.miiptv.SecureTest' --tests 'com.suso.miiptv.ParsingTest' --no-daemon -PbuildNumber=${{ github.run_number }} 2>&1 | tee test.log; then
            grep -E "Han cambiado|ahora:|antes:|error:|e: " test.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: informe-logos
          path: app/build/logo-report.tsv
          if-no-files-found: ignore

      - name: Compilar
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -z "$SIGNING_PASSWORD" ]; then
            echo "::error::Falta el secreto SIGNING_PASSWORD (contraseña de la llave de firma) en Settings → Secrets and variables → Actions"
            exit 1
          fi
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew assembleRelease --stacktrace --no-daemon -PbuildNumber=${{ github.run_number }} 2>&1 | tee build.log; then
            # Muestra los errores de compilación como avisos visibles en GitHub.
            { grep -E "^e: " build.log; grep -E "error:|ERROR:" build.log; } | head -9 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi

      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk MiIPTV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MiIPTV-apk
          path: MiIPTV.apk

      - name: Publicar versión descargable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Pepino IPTV ${{ github.run_number }}
          make_latest: true
          body: ${{ github.event.head_commit.message }}
          files: |
            MiIPTV.apk
            app/build/logo-report.tsv
