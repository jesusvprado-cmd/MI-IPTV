name: Compilar APK

# En «main» compila y publica la versión (la que se descargan los aparatos).
# En cualquier otra rama solo compila y pasa las pruebas: sirve para comprobar los cambios sin publicar nada.
on:
  push:
    branches: [ '**', '!registro' ]
  workflow_dispatch:

permissions:
  contents: write

# Una compilación cada vez y en orden: así una antigua que termine tarde no queda como «última versión».
# (Sin cancelar la que está en marcha, para no dejar a medias una versión publicada.)
# En las ramas de prueba, una compilación nueva cancela la anterior de esa rama (no publica nada).
concurrency:
  group: compilar-apk-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        run: |
          SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "Usando $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v5

      - name: Datos de los logos (van dentro de la app)
        run: python3 .github/scripts/logo_data.py

      - name: Prueba de logos
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew testDebugUnitTest --tests 'com.suso.miiptv.LogoGoldenTest' --tests 'com.suso.miiptv.SecureTest' --tests 'com.suso.miiptv.ParsingTest' --no-daemon -PbuildNumber=${{ github.run_number }} 2>&1 | tee test.log; then
            grep -E "Han cambiado|ahora:|antes:|error:|e: " test.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: informe-logos
          path: app/build/logo-report.tsv
          if-no-files-found: ignore

      - name: Compilar
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -z "$SIGNING_PASSWORD" ]; then
            echo "::error::Falta el secreto SIGNING_PASSWORD (contraseña de la llave de firma) en Settings → Secrets and variables → Actions"
            exit 1
          fi
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew assembleRelease --stacktrace --no-daemon -PbuildNumber=${{ github.run_number }} 2>&1 | tee build.log; then
            # Muestra los errores de compilación como avisos visibles en GitHub.
            { grep -E "^e: " build.log; grep -E "error:|ERROR:" build.log; } | head -9 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi

      # Si falla, el registro se guarda en la rama «registro» (para poder leerlo sin entrar en GitHub).
      - name: Guardar registro si falla
        if: failure() && github.ref == 'refs/heads/main'
        run: |
          mkdir -p /tmp/reg
          cp build.log test.log /tmp/reg/ 2>/dev/null || true
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan registro-tmp
          git rm -rf --quiet . || true
          git clean -fdxq
          cp /tmp/reg/* . 2>/dev/null || echo "sin registro" > build.log
          git add -A
          git commit -m "Registro de la compilación ${{ github.run_number }}"
          git push -f origin HEAD:registro

      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk MiIPTV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MiIPTV-apk
          path: MiIPTV.apk

      - name: Publicar versión descargable
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Pepino IPTV ${{ github.run_number }}
          make_latest: true
          body: ${{ github.event.head_commit.message }}
          files: |
            MiIPTV.apk
            app/build/logo-report.tsv
            app/build/outputs/mapping/release/mapping.txt
