name: Compilar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        run: |
          SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "Usando $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew assembleRelease --stacktrace --no-daemon 2>&1 | tee build.log; then
            # Muestra los errores de compilación como avisos visibles en GitHub.
            { grep -E "^e: " build.log; grep -E "error:|ERROR:" build.log; } | head -9 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi

      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk MiIPTV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MiIPTV-apk
          path: MiIPTV.apk

      - name: Publicar versión descargable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Mi IPTV ${{ github.run_number }}
          make_latest: true
          files: MiIPTV.apk
