name: Compilar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace --no-daemon
      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk MiIPTV.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MiIPTV-apk
          path: MiIPTV.apk
      - name: Publicar versión descargable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Mi IPTV ${{ github.run_number }}
          make_latest: true
          files: MiIPTV.apk
