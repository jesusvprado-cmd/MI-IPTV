name: Mapa de errores
# Recompila una versión antigua solo para sacar su mapping.txt (traducir los registros de cierres).
on:
  workflow_dispatch:
    inputs:
      ref: { description: "commit", required: true }
      number: { description: "número de versión", required: true }
permissions:
  contents: write
jobs:
  mapa:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with: { ref: "${{ inputs.ref }}" }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v5
      - run: python3 .github/scripts/logo_data.py
      - run: chmod +x gradlew && ./gradlew minifyReleaseWithR8 --no-daemon -PbuildNumber=${{ inputs.number }}
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cp app/build/outputs/mapping/release/mapping.txt mapping-${{ inputs.number }}.txt
          gh release view mapas >/dev/null 2>&1 || gh release create mapas --prerelease --title "Mapas de errores" --notes "mapping.txt de versiones antiguas"
          gh release upload mapas mapping-${{ inputs.number }}.txt --clobber
